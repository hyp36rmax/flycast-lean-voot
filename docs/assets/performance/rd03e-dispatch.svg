<text x="30" y="654" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">Cycles and elapsed time describe different host costs.</text>
<text x="30" y="685" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">Render-start P99 worsened; no unconditional speed-up claim.</text>
<text x="30" y="716" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">Historical workload, not current-source or GPU/FPS timing.</text>
<text x="30" y="747" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">Exact original CPU / GPU / OS linkage remains unverified.</text>
