<text x="30" y="300" font-size="21" style="fill:#172b3a" font-weight="400" text-anchor="start">After</text>
<rect x="145" y="276" width="390" height="30" rx="0" fill="#f2f5f7" stroke="#f2f5f7" stroke-width="2"/>
<rect x="145" y="276" width="297.63888989545455" height="30" rx="0" fill="#176e56" stroke="#176e56" stroke-width="2"/>
<text x="555" y="300" font-size="20" style="fill:#172b3a" font-weight="600" text-anchor="start">16,789,886</text>
