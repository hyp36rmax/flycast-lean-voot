<text x="555" y="482" font-size="20" style="fill:#172b3a" font-weight="600" text-anchor="start">23.9924</text>
<text x="30" y="535" font-size="21" style="fill:#172b3a" font-weight="400" text-anchor="start">After</text>
<rect x="145" y="511" width="390" height="30" rx="0" fill="#f2f5f7" stroke="#f2f5f7" stroke-width="2"/>
