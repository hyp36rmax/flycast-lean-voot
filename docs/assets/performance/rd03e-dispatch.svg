<svg xmlns="http://www.w3.org/2000/svg" width="720" height="795" viewBox="0 0 720 795" role="img" aria-labelledby="title desc">
<title id="title">SH-4 dispatch: cost and cadence</title><desc id="desc">Historical R&amp;D-03E reduced emulation-thread mean cycles, while render-start P99 wall time increased. Separate axes and units.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a} .minor{fill:#425466} .before{fill:#425466} .after{fill:#176e56} .warning{fill:#a5411e}</style>
<rect width="720" height="795" rx="8" fill="#fff" stroke="#c8d1d9"/>
<text x="30" y="42" font-size="27" style="fill:#172b3a" font-weight="600" text-anchor="start">SH-4 dispatch: cost and cadence</text>
<text x="30" y="80" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">Historical R&amp;D-03E  •  matched saved Solo at 3840 × 1080</text>
<text x="30" y="108" font-size="20" style="fill:#172b3a" font-weight="400" text-anchor="start">120 warmup frames; 600 measured frames per variant.</text>
<text x="30" y="170" font-size="22" style="fill:#172b3a" font-weight="600" text-anchor="start">Emulation thread mean</text>
<text x="30" y="198" font-size="19" style="fill:#425466" font-weight="400" text-anchor="start">cycles/frame  •  linear axis from zero</text>
<text x="30" y="247" font-size="21" style="fill:#172b3a" font-weight="400" text-anchor="start">Before</text>
<rect x="145" y="223" width="390" height="30" rx="0" fill="#f2f5f7" stroke="#f2f5f7" stroke-width="2"/>
